# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zmesconfmass.zmesconfmass
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: S4D_100
          url: http://saphanadev.ad.sanatmetal.hu:44300
          client: '100'
        app:
          name: ZMESCONFMASS
          description: zmesconfmass
          package: ZMES
          transport: S4DK900336
        exclude:
          - /test/
          - /localService/
